# Included inside the `http {}` block of the official nginx image.

limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_status 429;

upstream authguard_backend {
    server backend:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API ---------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- Static assets (content-hashed by Vite) ----------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- SPA ---------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
